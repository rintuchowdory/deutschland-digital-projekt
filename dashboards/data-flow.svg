<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <!-- Background flow lines -->
  <path d="M0,100 Q100,50 200,100 T400,100" stroke="#667eea" stroke-width="2" fill="none" opacity="0.3">
    <animate attributeName="d" values="M0,100 Q100,50 200,100 T400,100; M0,100 Q100,150 200,100 T400,100; M0,100 Q100,50 200,100 T400,100" dur="5s" repeatCount="indefinite" />
  </path>
  <path d="M0,120 Q150,70 300,120 T400,120" stroke="#764ba2" stroke-width="2" fill="none" opacity="0.3">
    <animate attributeName="d" values="M0,120 Q150,70 300,120 T400,120; M0,120 Q150,170 300,120 T400,120; M0,120 Q150,70 300,120 T400,120" dur="6s" repeatCount="indefinite" />
  </path>
  
  <!-- Data nodes -->
  <circle cx="50" cy="100" r="8" fill="#667eea">
    <animate attributeName="cy" values="100;90;100" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="150" cy="80" r="8" fill="#764ba2">
    <animate attributeName="cy" values="80;90;80" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="250" cy="120" r="8" fill="#f093fb">
    <animate attributeName="cy" values="120;110;120" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="350" cy="100" r="8" fill="#4facfe">
    <animate attributeName="cy" values="100;95;100" dur="3.5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Labels -->
  <text x="50" y="120" text-anchor="middle" fill="#7f8c8d" font-size="10">Daten</text>
  <text x="150" y="100" text-anchor="middle" fill="#7f8c8d" font-size="10">Analyse</text>
  <text x="250" y="140" text-anchor="middle" fill="#7f8c8d" font-size="10">Visualisierung</text>
  <text x="350" y="120" text-anchor="middle" fill="#7f8c8d" font-size="10">Ergebnis</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#667eea" stroke-width="0.5" opacity="0.1" />
      <path d="M 0 20 L 0 40 20 40" fill="none" stroke="#764ba2" stroke-width="0.5" opacity="0.1" />
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#grid)" />
  
  <!-- Animated dots -->
  <circle cx="20" cy="20" r="1" fill="#667eea" opacity="0.5">
    <animate attributeName="r" values="1;2;1" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="80" cy="80" r="1" fill="#764ba2" opacity="0.5">
    <animate attributeName="r" values="1;2;1" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="50" r="1" fill="#f093fb" opacity="0.5">
    <animate attributeName="r" values="1;3;1" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <!-- Server -->
  <rect x="50" y="120" width="60" height="40" fill="#667eea" rx="5" />
  <rect x="55" y="110" width="50" height="10" fill="#764ba2" rx="3" />
  <circle cx="80" cy="140" r="3" fill="#f093fb" />
  
  <!-- Cloud -->
  <path d="M150,80 Q160,60 180,80 Q190,50 210,80 Q220,60 230,80 Q240,50 250,80 L230,100 L200,100 L180,120 L150,120 L120,100 L100,100 Z" fill="white" stroke="#667eea" stroke-width="2" />
  
  <!-- Laptop -->
  <rect x="20" y="150" width="40" height="25" fill="#7f8c8d" rx="3" />
  <rect x="25" y="145" width="30" height="5" fill="#444" rx="2" />
  
  <!-- Mobile -->
  <rect x="250" y="140" width="15" height="25" fill="#333" rx="3" />
  <rect x="252" y="142" width="11" height="20" fill="#667eea" rx="2" />
  
  <!-- Connections -->
  <path d="M110,140 L150,100" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5" opacity="0.7" />
  <path d="M180,100 L200,100" stroke="#764ba2" stroke-width="2" stroke-dasharray="5,5" opacity="0.7" />
  <path d="M210,100 L250,150" stroke="#f093fb" stroke-width="2" stroke-dasharray="5,5" opacity="0.7" />
  
  <!-- Animated data flow -->
  <circle cx="150" cy="100" r="4" fill="#667eea">
    <animate attributeName="cx" values="150;160;150" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="100" r="4" fill="#764ba2">
    <animate attributeName="cx" values="200;190;200" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
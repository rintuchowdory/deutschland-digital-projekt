<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>KI-Nutzung in Unternehmen 2026</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div id="kiChart" style="width:100%;height:500px;"></div>
    <script>
        var data = [
            {
                x: ["IT/Telekommunikation", "Finanzen/Versicherungen", "Industrie 4.0", "Handel", "Gesundheitswesen", "Öffentlicher Sektor", "Mittelstand (50-500 MA)", "Großunternehmen (500+ MA)", "Startups"],
                y: [65, 58, 52, 45, 40, 30, 35, 60, 70],
                name: 'Nutzung 2026',
                type: 'bar',
                marker: { color: '#1f77b4' },
                hovertemplate: '<b>%{x}</b><br>Nutzung: %{y}%<br>Anwendung: %{customdata}<extra></extra>',
                customdata: [
                    "Chatbots, Code-Generierung",
                    "Betrugserkennung, Risikoanalyse",
                    "Predictive Maintenance, Qualitätskontrolle",
                    "Personalisierung, Lagerverwaltung",
                    "Diagnoseunterstützung, Patientenmanagement",
                    "Dokumentenanalyse, Bürgerdienste",
                    "Prozessautomatisierung, Kundenservice",
                    "Skalierung, Datenanalyse",
                    "Produktentwicklung, MVP-Tests"
                ]
            },
            {
                x: ["IT/Telekommunikation", "Finanzen/Versicherungen", "Industrie 4.0", "Handel", "Gesundheitswesen", "Öffentlicher Sektor", "Mittelstand (50-500 MA)", "Großunternehmen (500+ MA)", "Startups"],
                y: [20, 25, 30, 35, 40, 50, 48, 25, 15],
                name: 'Geplant 2026',
                type: 'bar',
                marker: { color: '#ff7f0e' },
                hovertemplate: '<b>%{x}</b><br>Geplant: %{y}%<extra></extra>'
            }
        ];
        var layout = {
            title: 'KI-Nutzung in deutschen Unternehmen 2026 (Bitkom-Studie)',
            xaxis: { title: 'Branche', tickangle: -45 },
            yaxis: { title: 'Anteil der Unternehmen in %' },
            barmode: 'group',
            height: 500,
            legend: { title: { text: 'Status' } }
        };
        Plotly.newPlot('kiChart', data, layout);
    </script>
</body>
</html>
